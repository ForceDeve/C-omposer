# C-omposer theme. Copy this file to ~/.config/c-omposer/themes/ and change it:
# every key is optional, and whatever you leave out is worked out from the rest.
# Same format as FHI themes (an FHI theme file works here too).
[theme]
name       = C-omposer Dark
scheme     = dark              # dark | light | system

# interface
window_bg  = #21252b           # window, header bar, menus
window_fg  = #d4d7de           # text
panel_bg   = #1b1d23           # sidebar, output panel
accent     = #528bff           # selection, buttons, focus

# the code
editor_bg  = #1b1d23
editor_fg  = #d4d7de
caret      = #528bff
selection  = #3e4451
gutter_fg  = #4b5263
gutter_current = #abb2bf
bracket    = #3b4252
font       = JetBrains Mono
font_size  = 11
radius     = 6

# syntax
keyword       = #c678dd
music_keyword = #ff79c6
type          = #e5c07b
music_type    = #56d4c4
user_type     = #f0a45d
builtin       = #4fc1ff
function      = #61afef
constant      = #f78c6c
number        = #d19a66
unit          = #e6b673
note          = #ff6e9c
string        = #98c379
char          = #98c379
comment       = #5c6370
preprocessor  = #e06c75
operator      = #89ddff
punctuation   = #abb2bf
error         = #ff5370
