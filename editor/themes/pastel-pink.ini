# Same idea as FHI's Pastel Pink.
[theme]
name       = Pastel Pink
scheme     = light             # light | dark | system
window_bg  = #fff0f5           # window, title bar, menus
window_fg  = #5b3a4a           # text
panel_bg   = #fff8fb           # sidebar, output
accent     = #f28cb1           # selection, buttons, focus
editor_bg  = #fff5f8
caret      = #e75a8f
radius     = 12
keyword       = #c2457a
music_keyword = #d14d8b
type          = #b07b2c
music_type    = #2f9e8f
user_type     = #c46a2b
builtin       = #3f7fc4
function      = #6b5fc4
constant      = #c4572f
number        = #a3622b
unit          = #a3622b
note          = #e0447e
string        = #4f9a5f
char          = #4f9a5f
comment       = #b89aa8
preprocessor  = #c94f6d
operator      = #8a5a72
punctuation   = #8a6878
error         = #d6304f
